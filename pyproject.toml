[project]
name = "mnemosyne-native-dashboard"
version = "0.1.0"
description = "Native Hermes dashboard for Mnemosyne memory stores."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Vaibhav Seth" }]
keywords = ["hermes-agent", "mnemosyne", "memory", "dashboard", "sqlite"]
dependencies = [
  "fastapi>=0.115,<1",
  "pydantic>=2,<3",
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Web Environment",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Database",
  "Topic :: Database :: Front-Ends",
]

[project.urls]
Homepage = "https://github.com/vabs95/mnemosyne-native-dashboard"
Issues = "https://github.com/vabs95/mnemosyne-native-dashboard/issues"

[project.optional-dependencies]
test = [
  "httpx>=0.27,<1",
  "pytest>=8,<10",
  "ruff>=0.8",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501", "E402"]
